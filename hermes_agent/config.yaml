name: Hermes Agent
version: "2026.9.21-3"
slug: hermes_agent
description: Run Hermes Agent as a Home Assistant add-on using the official Hermes image.
url: https://github.com/NousResearch/hermes-agent
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
hassio_api: true
hassio_role: manager
homeassistant_api: false
webui: "http://[HOST]:[PORT:9119]/"
map:
  - type: data
    path: /opt/data
environment:
  HERMES_GATEWAY_BOOTSTRAP_STATE: "running"
  HERMES_DASHBOARD: "1"
  HERMES_DASHBOARD_HOST: "0.0.0.0"
  HERMES_DASHBOARD_PORT: "9119"
  API_SERVER_ENABLED: "true"
  API_SERVER_HOST: "0.0.0.0"
  API_SERVER_PORT: "8642"
ports:
  8642/tcp: 8642
  9119/tcp: 9119
ports_description:
  8642/tcp: Hermes OpenAI-compatible API
  9119/tcp: Hermes dashboard
options:
  enable_ha_cli: false
  config_yaml: |
    {}
schema:
  enable_ha_cli: bool
  config_yaml: str
