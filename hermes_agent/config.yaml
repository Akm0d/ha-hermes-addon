name: Hermes Agent
version: "2026.9.21-14"
slug: hermes_agent
description: Run Hermes Agent as a Home Assistant add-on using the official Hermes image.
url: https://github.com/NousResearch/hermes-agent
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
hassio_api: true
hassio_role: manager
homeassistant_api: false
ingress: true
ingress_port: 9119
ingress_stream: true
panel_title: Hermes Agent
panel_icon: mdi:robot-outline
map:
  - type: data
    path: /opt/data
environment:
  HERMES_GATEWAY_BOOTSTRAP_STATE: "running"
  HERMES_DASHBOARD: "1"
  HERMES_DASHBOARD_HOST: "127.0.0.1"
  HERMES_DASHBOARD_PORT: "9120"
  API_SERVER_ENABLED: "true"
  API_SERVER_HOST: "0.0.0.0"
  API_SERVER_PORT: "8642"
  A2A_HOST: "0.0.0.0"
  A2A_PORT: "9900"
ports:
  8642/tcp: 8642
  9900/tcp: 9900
ports_description:
  8642/tcp: Hermes OpenAI-compatible API
  9900/tcp: Hermes A2A endpoint
options:
  api_server_key: ""
schema:
  api_server_key: password
